# Runs the multiplayer smoke test, the feature tests and the bot soaks on every
# push and pull request, on Linux and Windows. macOS is covered by running
# tools/soak.sh locally. The reports are uploaded as an artifact on every run.
#
# Each OS runs two jobs side by side: "features" (smoke and every feature test,
# each quitting as soon as its test is done) and "soaks" (the bot soaks, which
# run a fixed time and judge smoothness, so they get a runner to themselves).
# --run-seconds on a feature test is only a ceiling for a hung test.
#
# Ports are fixed per test (docs/DECISIONS.md, "CI ports"): smoke 7791, the soaks
# 7792 and 7793, feature tests 7794 up. Each step's --port= must equal the Port of
# the same test in tools/ci_local.ps1's $Tests; `tools\ci_local.ps1 -CheckPorts`
# compares them.
name: netcode

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        part: [features, soaks]
        include:
          - os: ubuntu-latest
            archive: Godot_v4.7.2-stable_linux.x86_64.zip
            binary: Godot_v4.7.2-stable_linux.x86_64
            players: 4
          - os: windows-latest
            archive: Godot_v4.7.2-stable_win64.exe.zip
            binary: Godot_v4.7.2-stable_win64_console.exe
            players: 2
    name: ${{ matrix.part }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${{ matrix.archive }}"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/${{ matrix.binary }}" || true
          echo "GODOT=$RUNNER_TEMP/godot/${{ matrix.binary }}" >> "$GITHUB_ENV"

      - name: Import the project
        run: |
          "$GODOT" --headless --path . --import || true

      - name: Smoke test
        if: matrix.part == 'features'
        run: |
          "$GODOT" --headless --path . -- --smoke-test --port=7791

      # A wording hit must not skip every netcode test after it, so this step only
      # records its outcome; "Guardrail verdict" near the end fails the job.
      - name: Guardrail (no real agencies, no jokes about origin, status or accents)
        id: guardrail
        if: (success() || failure()) && matrix.part == 'features'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          "$GODOT" --headless --path . --script res://tools/guardrail_check.gd

      # Headless, no port: closed shapes, house contracts, and every tree kind, crown,
      # variant and season against its budget, the season rules and the LOD wiring.
      - name: Mesh check (shapes, houses, tree budgets, seasons and LOD)
        if: matrix.part == 'features'
        timeout-minutes: 3
        run: |
          mkdir -p build/soak/ci-meshcheck
          "$GODOT" --headless --path . --script res://tools/mesh_check.gd 2>&1 | tee build/soak/ci-meshcheck/host.log
          # It must reach its last check: a --script that stops early can still exit 0.
          grep -q "BlockCheck\] seasons" build/soak/ci-meshcheck/host.log

      - name: Leaf look check (species budgets, no stripes, palettes, heights, budgets)
        if: matrix.part == 'features'
        timeout-minutes: 3
        run: |
          "$GODOT" --headless --path . --script res://tools/leaf_look_check.gd

      - name: Job test (two whole jobs, rides included)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-job
          "$GODOT" --headless --path . -- --host --port=7794 --name=Tester --no-steam --job-test --job-seed=777 --yard-size=1 --measure="$PWD/build/soak/ci-job/host.json" --run-seconds=75 | grep "JobTest" || true
          $PY -c "import json,sys; r=json.load(open('build/soak/ci-job/host.json'))['job_test']; print(r.get('error','')); sys.exit(0 if r.get('ok') else 1)"

      - name: Bonk test (light, medium, and heavy throws at another player)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-bonk
          "$GODOT" --headless --path . -- --host --port=7795 --name=Tester --no-steam --start-zone=lot --bonk-test --measure="$PWD/build/soak/ci-bonk/host.json" --run-seconds=26 > build/soak/ci-bonk/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7795 --name=Target --no-steam --measure="$PWD/build/soak/ci-bonk/target.json" --run-seconds=22 > build/soak/ci-bonk/target.log 2>&1
          wait
          grep "BonkTest" build/soak/ci-bonk/host.log || true
          $PY -c "import json,sys; r=json.load(open('build/soak/ci-bonk/host.json'))['bonk_test']; sys.exit(0 if r.get('ok') else 1)"

      - name: Work test (every task with every tool, and a client builds the same yard)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-work
          "$GODOT" --headless --path . -- --host --port=7796 --name=Tester --no-steam --start-zone=lot --all-tools --all-tasks --job-seed=777 --work-test --measure="$PWD/build/soak/ci-work/host.json" --run-seconds=120 > build/soak/ci-work/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7796 --name=Target --no-steam --measure="$PWD/build/soak/ci-work/target.json" --run-seconds=115 > build/soak/ci-work/target.log 2>&1
          wait
          grep "WorkTest" build/soak/ci-work/host.log || true
          $PY -c "import json,sys; h=json.load(open('build/soak/ci-work/host.json')); c=json.load(open('build/soak/ci-work/target.json')); ok=h['work_test'].get('ok') and h['lot_layout']==c['lot_layout'] and h['job_progress']==c['job_progress']; print('layout', h['lot_layout'], c['lot_layout']); sys.exit(0 if ok else 1)"

      - name: Throw test (tap drops, wind-up distance, one item at a time, strain and faint)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-throw
          "$GODOT" --headless --path . -- --host --port=7797 --name=Tester --no-steam --start-zone=lot --throw-test --measure="$PWD/build/soak/ci-throw/host.json" --run-seconds=34 | grep "ThrowTest" || true
          $PY -c "import json,sys; r=json.load(open('build/soak/ci-throw/host.json'))['throw_test']; sys.exit(0 if r.get('ok') else 1)"

      - name: Water test (hose snaps, arcs wash windows, the bill, the washer's tank)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-water
          "$GODOT" --headless --path . -- --host --port=7798 --name=Tester --no-steam --start-zone=lot --all-tools --all-tasks --job-seed=4242 --water-test --measure="$PWD/build/soak/ci-water/host.json" --run-seconds=50 | grep "WaterTest" || true
          $PY -c "import json,sys; r=json.load(open('build/soak/ci-water/host.json'))['water_test']; sys.exit(0 if r.get('ok') else 1)"

      - name: Hide test (live peek camera, dives, tells, suspicion, inspection, the pile, the muffle)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-hide
          "$GODOT" --headless --path . -- --host --port=7828 --name=Tester --no-steam --start-zone=lot --all-tools --job-seed=777 --yard-size=1 --hide-test --hide-test --measure="$PWD/build/soak/ci-hide/host.json" --run-seconds=120 > build/soak/ci-hide/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7828 --name=Target --no-steam --hide-test --measure="$PWD/build/soak/ci-hide/target.json" --run-seconds=115 > build/soak/ci-hide/target.log 2>&1
          wait
          grep "HideTest" build/soak/ci-hide/host.log build/soak/ci-hide/target.log || true
          $PY -c "import json,sys; h=json.load(open('build/soak/ci-hide/host.json')); t=json.load(open('build/soak/ci-hide/target.json')); sys.exit(0 if h['hide_test'].get('ok') and t['hide_test'].get('ok') else 1)"

      - name: Mower test (mulch, flung litter, cut hose, burst bag, gnome, feet, the bill)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-mower
          "$GODOT" --headless --path . -- --host --port=7799 --name=Tester --no-steam --start-zone=lot --all-tools --all-tasks --job-seed=777 --mower-test --measure="$PWD/build/soak/ci-mower/host.json" --run-seconds=55 > build/soak/ci-mower/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7799 --name=Target --no-steam --measure="$PWD/build/soak/ci-mower/target.json" --run-seconds=50 > build/soak/ci-mower/target.log 2>&1
          wait
          grep "MowerTest" build/soak/ci-mower/host.log || true
          $PY -c "import json,sys; r=json.load(open('build/soak/ci-mower/host.json'))['mower_test']; sys.exit(0 if r.get('ok') else 1)"

      - name: Rake net test (stroke events, prediction ledger, no snap-back at 150 ms / 2% loss, golden density)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-rake-net
          "$GODOT" --headless --path . -- --host --port=7821 --name=Tester --no-steam --start-zone=lot --all-tools --job-seed=777 --yard-size=1 --rake-net-test --sim-lag=150 --sim-loss=2 --rake-net-test --measure="$PWD/build/soak/ci-rake-net/host.json" --run-seconds=75 > build/soak/ci-rake-net/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7821 --name=Target --no-steam --sim-lag=150 --sim-loss=2 --rake-net-test --measure="$PWD/build/soak/ci-rake-net/target.json" --run-seconds=70 > build/soak/ci-rake-net/target.log 2>&1
          wait
          grep "RakeNetTest\|LeafGolden" build/soak/ci-rake-net/host.log build/soak/ci-rake-net/target.log || true
          $PY -c "import json,sys; h=json.load(open('build/soak/ci-rake-net/host.json')); t=json.load(open('build/soak/ci-rake-net/target.json')); sys.exit(0 if h['rake_net_test'].get('ok') and t['rake_net_test'].get('ok') else 1)"

      - name: Job board test (offers, picking, the picked yard, new offers; client matches)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-board
          "$GODOT" --headless --path . -- --host --port=7800 --name=Tester --no-steam --board-test --measure="$PWD/build/soak/ci-board/host.json" --run-seconds=30 > build/soak/ci-board/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7800 --name=Target --no-steam --measure="$PWD/build/soak/ci-board/target.json" --run-seconds=25 > build/soak/ci-board/target.log 2>&1
          wait
          grep "BoardTest" build/soak/ci-board/host.log || true
          $PY -c "import json,sys; h=json.load(open('build/soak/ci-board/host.json')); t=json.load(open('build/soak/ci-board/target.json')); sys.exit(0 if h['board_test'].get('ok') and h['board'] == t['board'] else 1)"

      - name: Gag test (heat, runaway mower, ladder knock-down, pile hiding, three NICE BOYS, paint and water)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-gag
          "$GODOT" --headless --path . -- --host --port=7801 --name=Tester --no-steam --start-zone=lot --all-tools --all-tasks --job-seed=777 --yard-size=1 --gag-test --measure="$PWD/build/soak/ci-gag/host.json" --run-seconds=80 > build/soak/ci-gag/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7801 --name=Target --no-steam --measure="$PWD/build/soak/ci-gag/target.json" --run-seconds=75 > build/soak/ci-gag/target.log 2>&1
          wait
          grep "GagTest" build/soak/ci-gag/host.log || true
          $PY -c "import json,sys; h=json.load(open('build/soak/ci-gag/host.json')); t=json.load(open('build/soak/ci-gag/target.json')); sys.exit(0 if h['gag_test'].get('ok') and abs(h['heat'] - t['heat']) < 1.5 else 1)"

      - name: Leaf motion test (conservation, no teleports, no duplicates, quiescence, caps)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-leaf_motion
          "$GODOT" --headless --path . -- --host --port=7822 --name=Tester --no-steam --start-zone=lot --all-tools --job-seed=777 --yard-size=1 --sim-lag=120 --leaf-motion-headless --leaf-motion-test --measure="$PWD/build/soak/ci-leaf_motion/host.json" --run-seconds=100 > build/soak/ci-leaf_motion/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7822 --name=Target --no-steam --sim-lag=120 --leaf-motion-headless --leaf-motion-test --measure="$PWD/build/soak/ci-leaf_motion/target.json" --run-seconds=95 > build/soak/ci-leaf_motion/target.log 2>&1
          wait
          grep "LeafMotionTest" build/soak/ci-leaf_motion/host.log || true
          $PY -c "import json,sys; h=json.load(open('build/soak/ci-leaf_motion/host.json')); sys.exit(0 if h['leaf_motion_test'].get('ok') else 1)"

      - name: Brawl test (wind-up punch, whack, grab, carry, set down, throw a player)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-brawl
          "$GODOT" --headless --path . -- --host --port=7802 --name=Tester --no-steam --start-zone=lot --all-tools --job-seed=777 --yard-size=1 --brawl-test --measure="$PWD/build/soak/ci-brawl/host.json" --run-seconds=50 > build/soak/ci-brawl/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7802 --name=Target --no-steam --run-seconds=45 > build/soak/ci-brawl/target.log 2>&1
          wait
          grep "BrawlTest" build/soak/ci-brawl/host.log || true
          $PY -c "import json,sys; r=json.load(open('build/soak/ci-brawl/host.json'))['brawl_test']; sys.exit(0 if r.get('ok') else 1)"

      - name: Encounter test (the NICE BOYS' catch, R2 chunk 2; 150 ms lag, 2% loss)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-encounter
          "$GODOT" --headless --path . -- --host --port=7827 --name=Tester --no-steam --start-zone=lot --all-tools --job-seed=777 --yard-size=1 --encounter-test --sim-lag=150 --sim-loss=2 --measure="$PWD/build/soak/ci-encounter/host.json" --run-seconds=170 > build/soak/ci-encounter/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7827 --name=Target --no-steam --sim-lag=150 --sim-loss=2 --encounter-test --run-seconds=160 > build/soak/ci-encounter/target.log 2>&1
          wait
          grep "EncounterTest" build/soak/ci-encounter/host.log || true
          $PY -c "import json,sys; r=json.load(open('build/soak/ci-encounter/host.json'))['encounter_test']; sys.exit(0 if r.get('ok') else 1)"

      - name: Day test (the clock, sleeping, XP banked at bedtime, rank-ups, quiet hours, 2 AM)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-day
          "$GODOT" --headless --path . -- --host --port=7803 --name=Tester --no-steam --day-test --measure="$PWD/build/soak/ci-day/host.json" --run-seconds=30 > build/soak/ci-day/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7803 --name=Target --no-steam --measure="$PWD/build/soak/ci-day/target.json" --run-seconds=26 > build/soak/ci-day/target.log 2>&1
          wait
          grep "DayTest" build/soak/ci-day/host.log || true
          $PY -c "import json,sys; h=json.load(open('build/soak/ci-day/host.json')); t=json.load(open('build/soak/ci-day/target.json')); sys.exit(0 if h['day_test'].get('ok') and h['day'] == t['day'] else 1)"

      - name: Town test (clients, requests, a paid job, referrals, regrowth, a new neighborhood)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-town
          "$GODOT" --headless --path . -- --host --port=7804 --name=Tester --no-steam --town-test --measure="$PWD/build/soak/ci-town/host.json" --run-seconds=40 > build/soak/ci-town/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7804 --name=Target --no-steam --measure="$PWD/build/soak/ci-town/target.json" --run-seconds=36 > build/soak/ci-town/target.log 2>&1
          wait
          grep "TownTest" build/soak/ci-town/host.log || true
          $PY -c "import json,sys; h=json.load(open('build/soak/ci-town/host.json')); t=json.load(open('build/soak/ci-town/target.json')); sys.exit(0 if h['town_test'].get('ok') and h['town'] == t['town'] else 1)"

      - name: Layout test (36 yards: solids inside solids, props and work spots buried)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-layout
          "$GODOT" --headless --path . -- --host --port=7805 --name=Tester --no-steam --start-zone=lot --layout-test --measure="$PWD/build/soak/ci-layout/host.json" --run-seconds=120 > build/soak/ci-layout/host.log 2>&1
          grep "LayoutTest" build/soak/ci-layout/host.log || true
          $PY -c "import json,sys; r=json.load(open('build/soak/ci-layout/host.json'))['layout_test']; sys.exit(0 if r.get('ok') else 1)"

      - name: Art test (every neighborhood and season - styles, signatures, budgets, layout, determinism; a client builds the same block)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-art
          "$GODOT" --headless --path . -- --host --port=7813 --name=Tester --no-steam --legacy-map --start-zone=lot --job-seed=777 --hood=lakeside --start-day=8 --art-test --measure="$PWD/build/soak/ci-art/host.json" --run-seconds=150 > build/soak/ci-art/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7813 --name=Target --no-steam --measure="$PWD/build/soak/ci-art/target.json" --run-seconds=140 > build/soak/ci-art/target.log 2>&1
          wait
          grep "ArtTest\|\[Art\]" build/soak/ci-art/host.log || true
          $PY -c "import json,sys; h=json.load(open('build/soak/ci-art/host.json')); t=json.load(open('build/soak/ci-art/target.json')); sys.exit(0 if h['art_test'].get('ok') and h['lot_art'] != 0 and h['lot_art'] == t['lot_art'] else 1)"

      - name: Hire test (a hired hand rakes, bags, and loads Chefty; wages at bedtime)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-hire
          "$GODOT" --headless --path . -- --host --port=7806 --name=Tester --no-steam --start-zone=lot --job-seed=777 --yard-size=1 --rank=22 --hire-test --measure="$PWD/build/soak/ci-hire/host.json" --run-seconds=70 > build/soak/ci-hire/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7806 --name=Target --no-steam --measure="$PWD/build/soak/ci-hire/target.json" --run-seconds=65 > build/soak/ci-hire/target.log 2>&1
          wait
          grep "HireTest" build/soak/ci-hire/host.log || true
          $PY -c "import json,sys; h=json.load(open('build/soak/ci-hire/host.json')); t=json.load(open('build/soak/ci-hire/target.json')); sys.exit(0 if h['hire_test'].get('ok') and t['crew_hands'] == 1 else 1)"

      - name: Rake stroke test (bite timing, remote swing, release, crew hand)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-rake_stroke
          "$GODOT" --headless --path . -- --host --port=7823 --name=Tester --no-steam --start-zone=lot --job-seed=777 --yard-size=1 --rank=22 --rake-stroke-test --measure="$PWD/build/soak/ci-rake_stroke/host.json" --run-seconds=60 > build/soak/ci-rake_stroke/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7823 --name=Target --no-steam --rake-stroke-test --measure="$PWD/build/soak/ci-rake_stroke/target.json" --run-seconds=55 > build/soak/ci-rake_stroke/target.log 2>&1
          wait
          grep "RakeStrokeTest" build/soak/ci-rake_stroke/host.log build/soak/ci-rake_stroke/target.log || true
          $PY -c "import json,sys; h=json.load(open('build/soak/ci-rake_stroke/host.json')); t=json.load(open('build/soak/ci-rake_stroke/target.json')); sys.exit(0 if h['rake_stroke_test'].get('ok') and t['rake_stroke_test'].get('ok') else 1)"

      - name: Rival and seasons test (TurfMasters poach, signs, winning back; seasons by day)
        if: matrix.part == 'features'
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-rival
