          mkdir -p build/soak/ci-lens
          "$GODOT" --headless --path . -- --host --port=7841 --name=Tester --no-steam --start-zone=lot --job-seed=777 --yard-size=1 --lens-test --sim-lag=150 --lens-test --measure="$PWD/build/soak/ci-lens/host.json" --run-seconds=90 > build/soak/ci-lens/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7841 --name=Target --no-steam --sim-lag=150 --lens-test --measure="$PWD/build/soak/ci-lens/target.json" --run-seconds=85 > build/soak/ci-lens/target.log 2>&1
          wait
          grep "LensTest" build/soak/ci-lens/host.log build/soak/ci-lens/target.log || true
          $PY -c "import json,sys; h=json.load(open('build/soak/ci-lens/host.json')); t=json.load(open('build/soak/ci-lens/target.json')); sys.exit(0 if h['lens_test'].get('ok') and t['lens_test'].get('ok') else 1)"
      - name: Bot soak (150 ms, 2% loss, late joiner)
        if: matrix.part == 'soaks'
        run: |
          if command -v python3 >/dev/null 2>&1; then export PYTHON=python3; else export PYTHON=python; fi
          set +e
          tools/soak.sh -n ${{ matrix.players }} -s 45 -P 7792 -o "$PWD/build/soak/ci"
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::Soak inconclusive: the runner was too busy to judge smoothness."
            exit 0
          fi
          exit "$code"

      - name: Run event soak (cues, hiding, captures, the Annex)
        if: runner.os == 'Linux' && matrix.part == 'soaks'
        run: |
          export PYTHON=python3
          set +e
          tools/soak.sh -n 4 -s 170 -e 65 -P 7793 -o "$PWD/build/soak/ci-event"
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::Run event soak inconclusive: the runner was too busy to judge timing."
            exit 0
          fi
          exit "$code"

      # Keep this after every feature test (add new tests above it).
      - name: Guardrail verdict
        if: always() && matrix.part == 'features' && steps.guardrail.outcome == 'failure'
        run: |
          echo "::error::The humor guardrail failed (outcome: ${{ steps.guardrail.outcome }}). See the Guardrail step for each hit; reword the line."
          exit 1

      - name: Upload soak reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ matrix.os }}-${{ matrix.part }}
          path: build/soak
          if-no-files-found: ignore
