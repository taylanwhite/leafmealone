# Runs the multiplayer smoke test and a short bot soak on every push and pull
# request, on Linux and Windows. macOS is covered by running tools/soak.sh
# locally. The soak reports are uploaded as an artifact on every run.
name: netcode

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: Godot_v4.7.2-stable_linux.x86_64.zip
            binary: Godot_v4.7.2-stable_linux.x86_64
            players: 4
          - os: windows-latest
            archive: Godot_v4.7.2-stable_win64.exe.zip
            binary: Godot_v4.7.2-stable_win64_console.exe
            players: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${{ matrix.archive }}"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/${{ matrix.binary }}" || true
          echo "GODOT=$RUNNER_TEMP/godot/${{ matrix.binary }}" >> "$GITHUB_ENV"

      - name: Import the project
        run: |
          "$GODOT" --headless --path . --import || true

      - name: Smoke test
        run: |
          "$GODOT" --headless --path . -- --smoke-test --port=7791

      - name: Job test (two whole jobs, rides included)
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-job
          "$GODOT" --headless --path . -- --host --port=7794 --name=Tester --no-steam --job-test --measure="$PWD/build/soak/ci-job/host.json" --run-seconds=75 | grep "JobTest" || true
          $PY -c "import json,sys; r=json.load(open('build/soak/ci-job/host.json'))['job_test']; print(r.get('error','')); sys.exit(0 if r.get('ok') else 1)"

      - name: Bonk test (light, medium, and heavy throws at another player)
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-bonk
          "$GODOT" --headless --path . -- --host --port=7795 --name=Tester --no-steam --start-zone=lot --bonk-test --measure="$PWD/build/soak/ci-bonk/host.json" --run-seconds=26 > build/soak/ci-bonk/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7795 --name=Target --no-steam --measure="$PWD/build/soak/ci-bonk/target.json" --run-seconds=22 > build/soak/ci-bonk/target.log 2>&1
          wait
          grep "BonkTest" build/soak/ci-bonk/host.log || true
          $PY -c "import json,sys; r=json.load(open('build/soak/ci-bonk/host.json'))['bonk_test']; sys.exit(0 if r.get('ok') else 1)"

      - name: Work test (every task with every tool, and a client builds the same yard)
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-work
          "$GODOT" --headless --path . -- --host --port=7796 --name=Tester --no-steam --start-zone=lot --all-tools --all-tasks --job-seed=777 --work-test --measure="$PWD/build/soak/ci-work/host.json" --run-seconds=45 > build/soak/ci-work/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7796 --name=Target --no-steam --measure="$PWD/build/soak/ci-work/target.json" --run-seconds=40 > build/soak/ci-work/target.log 2>&1
          wait
          grep "WorkTest" build/soak/ci-work/host.log || true
          $PY -c "import json,sys; h=json.load(open('build/soak/ci-work/host.json')); c=json.load(open('build/soak/ci-work/target.json')); ok=h['work_test'].get('ok') and h['lot_layout']==c['lot_layout'] and h['job_progress']==c['job_progress']; print('layout', h['lot_layout'], c['lot_layout']); sys.exit(0 if ok else 1)"

      - name: Throw test (tap drops, wind-up distance, one item at a time, strain and faint)
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-throw
          "$GODOT" --headless --path . -- --host --port=7797 --name=Tester --no-steam --start-zone=lot --throw-test --measure="$PWD/build/soak/ci-throw/host.json" --run-seconds=34 | grep "ThrowTest" || true
          $PY -c "import json,sys; r=json.load(open('build/soak/ci-throw/host.json'))['throw_test']; sys.exit(0 if r.get('ok') else 1)"

      - name: Water test (hose snaps, arcs wash windows, the bill, the washer's tank)
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-water
          "$GODOT" --headless --path . -- --host --port=7798 --name=Tester --no-steam --start-zone=lot --all-tools --all-tasks --job-seed=4242 --water-test --measure="$PWD/build/soak/ci-water/host.json" --run-seconds=50 | grep "WaterTest" || true
          $PY -c "import json,sys; r=json.load(open('build/soak/ci-water/host.json'))['water_test']; sys.exit(0 if r.get('ok') else 1)"

      - name: Mower test (mulch, flung litter, cut hose, burst bag, gnome, feet, the bill)
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          mkdir -p build/soak/ci-mower
          "$GODOT" --headless --path . -- --host --port=7799 --name=Tester --no-steam --start-zone=lot --all-tools --all-tasks --job-seed=777 --mower-test --measure="$PWD/build/soak/ci-mower/host.json" --run-seconds=55 > build/soak/ci-mower/host.log 2>&1 &
          sleep 3
          "$GODOT" --headless --path . -- --join=127.0.0.1 --port=7799 --name=Target --no-steam --measure="$PWD/build/soak/ci-mower/target.json" --run-seconds=50 > build/soak/ci-mower/target.log 2>&1
          wait
          grep "MowerTest" build/soak/ci-mower/host.log || true
          $PY -c "import json,sys; r=json.load(open('build/soak/ci-mower/host.json'))['mower_test']; sys.exit(0 if r.get('ok') else 1)"

      - name: Bot soak (150 ms, 2% loss, late joiner)
        run: |
          if command -v python3 >/dev/null 2>&1; then export PYTHON=python3; else export PYTHON=python; fi
          set +e
          tools/soak.sh -n ${{ matrix.players }} -s 45 -P 7792 -o "$PWD/build/soak/ci"
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::Soak inconclusive: the runner was too busy to judge smoothness."
            exit 0
          fi
          exit "$code"

      - name: Run event soak (cues, hiding, captures, Border Return)
        if: runner.os == 'Linux'
        run: |
          export PYTHON=python3
          set +e
          tools/soak.sh -n 4 -s 170 -e 65 -P 7793 -o "$PWD/build/soak/ci-event"
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::Run event soak inconclusive: the runner was too busy to judge timing."
            exit 0
          fi
          exit "$code"

      - name: Upload soak reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ matrix.os }}
          path: build/soak
          if-no-files-found: ignore
